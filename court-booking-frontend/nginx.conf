server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss
               application/json image/svg+xml;

    # Cache static assets (JS/CSS/Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy — forward /api/* đến backend ECS
    # Thay <ALB_DNS_NAME> bằng DNS của ALB khi deploy
    # location /api/ {
    #     proxy_pass http://<ALB_DNS_NAME>/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # SPA fallback — mọi route đều trả về index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint cho ALB/ECS
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Bảo mật: ẩn version Nginx
    server_tokens off;
}
